<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smart Trees: Local Microclimate Analysis</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-green: #1b4d3e;
        --accent-emerald: #267d6a;
        --dwd-blue: #2980b9;
        --card-bg: #ffffff;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--primary-green);
        color: #f5f5f5;
      }

      #sidebar {
        width: 360px;
        height: 100vh;
        background: var(--primary-green);
        padding: 25px;
        box-sizing: border-box;
        overflow-y: auto;
        box-shadow: 4px 0 15px rgba(0, 0, 0, 0.3);
        z-index: 10;
        display: flex;
        flex-direction: column;
      }

      h2 {
        font-size: 1.4em;
        margin-top: 0;
        border-bottom: 2px solid var(--accent-emerald);
        padding-bottom: 10px;
        line-height: 1.2;
      }

      #map {
        flex-grow: 1;
        height: 100vh;
      }

      /* --- LAYER CONTROLS --- */
      .layer-ctrl {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .ctrl-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 0.95em;
      }

      /* Custom Toggle Switch Style */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider-toggle {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #444;
        transition: 0.4s;
        border-radius: 20px;
      }

      .slider-toggle:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }

      input:checked + .slider-toggle {
        background-color: var(--accent-emerald);
      }
      input:checked + .slider-toggle:before {
        transform: translateX(20px);
      }

      /* --- ANALYSIS PANEL --- */
      .data-panel {
        background: var(--card-bg);
        color: #2c3e50;
        padding: 20px;
        border-radius: 15px;
        flex-grow: 1;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      /* --- MARKER STYLES --- */
      .marker {
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .marker:hover {
        transform: scale(1.2);
      }

      .tree-marker {
        background-image: url("tree.svg");
        width: 45px;
        height: 45px;
      }

      .dwd-marker {
        background-image: url("weatherstation.svg");
        width: 28px;
        height: 28px;
        background-color: var(--dwd-blue);
        border: 2px solid white;
        border-radius: 50%;
      }

      /* 💡 NEW: Style rule for your Custom Proprietary Weather Equipment */
      .custom-marker {
        background-image: url("weatherstation_1.svg");
        width: 45px;
        height: 45px;
      }

      /* --- LEGEND --- */
      .legend {
        margin-top: 20px;
        padding: 10px;
        background: rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        font-size: 0.75em;
        color: rgba(255, 255, 255, 0.7);
      }
      .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 8px;
      }

      /* --- RANGE SLIDER STYLING --- */
      input[type="range"] {
        width: 100%;
        margin-top: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>Microclimate Tree sensors vs DWD Data</h2>

      <div class="layer-ctrl">
        <div class="ctrl-row">
          <span>🌳 Smart Trees</span>
          <label class="switch">
            <input type="checkbox" id="tree-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>
        <div class="ctrl-row">
          <span>🌦️ DWD Synop Stations</span>
          <label class="switch">
            <input type="checkbox" id="dwd-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>

        <div class="ctrl-row">
          <span>🛡️ Weather Stations</span>
          <label class="switch">
            <input type="checkbox" id="custom-toggle" checked />
            <span class="slider-toggle"></span>
          </label>
        </div>

        <div
          style="
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              font-size: 0.85em;
              margin-bottom: 5px;
            "
          >
            <span>🔍 Local Analysis Radius</span>
            <b id="radius-val" style="color: var(--accent-emerald)">10km</b>
          </div>
          <input
            type="range"
            id="radius-slider"
            min="10000"
            max="50000"
            step="10000"
            value="10000"
          />
        </div>
      </div>

      <div id="analysis-panel" class="data-panel">
        <p style="text-align: center; color: #95a5a6; padding-top: 20px">
          Select a point to begin localized microclimate analysis.
        </p>
      </div>

      <div class="legend">
        <div class="legend-item">
          <span class="dot" style="background: #ff4e50"></span>
          <span>Heat Island (Delta > 0)</span>
        </div>
        <div class="legend-item">
          <span class="dot" style="background: #00dbde"></span>
          <span>Cooling Effect (Delta < 0)</span>
        </div>
        <div class="legend-item">
          <span class="dot" style="background: var(--dwd-blue)"></span>
          <span>Primary DWD Synop Gear</span>
        </div>
        <div class="legend-item">
          <span class="dot" style="background: #e67e22"></span>
          <span>Weather stations Network</span>
        </div>
      </div>
    </div>

    <div id="map"></div>

    <script src="map.js"></script>
  </body>
</html>
